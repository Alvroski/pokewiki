<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PokéWiki — Evolution Compendium (printable)</title>
<style>
  :root{--ink:#111;--grey:#666;--line:#ddd;--red:#c0392b;--gold:#e0b64a}
  *{box-sizing:border-box}
  body{margin:0;background:#dcdce2;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:11px}
  .toolbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:9}
  .toolbar b{color:var(--red)}
  .toolbar button,.toolbar select{font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  .toolbar .print{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}

  /* an A4 page (210×297mm ≈ 794×1123px @96dpi) */
  .page{width:794px;height:1123px;background:#fff;margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.25);position:relative}
  .frame{position:absolute;inset:14px;border:3px solid var(--red);border-radius:16px;
    box-shadow:inset 0 0 0 2px var(--gold);display:flex;flex-direction:column;padding:16px 20px}
  .phead{flex:0 0 auto;text-align:center;font-weight:800;color:var(--red);letter-spacing:2px;
    font-size:12px;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:8px}
  .phead b{color:var(--ink)}
  .content{flex:1 1 auto;overflow:hidden}
  .pfoot{flex:0 0 auto;text-align:center;padding-top:6px;color:var(--grey);font-size:11px}
  .pfoot .ball{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
    border-radius:50%;border:2px solid var(--red);font-size:9px;font-weight:800;color:var(--red);
    vertical-align:middle;margin-right:6px;background:
      linear-gradient(#fff 0 48%,var(--red) 48% 52%,#fff 52% 100%)}

  /* cover */
  .page.cover .phead{display:none}
  .page.cover .content{display:flex;flex-direction:column}
  .cover .inner{flex:1;display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:10px 0}
  .cover h1{font-size:54px;margin:0;letter-spacing:2px}
  .cover h1 span{color:var(--red)}
  .cover h2{font-size:20px;font-weight:500;color:var(--grey);margin:6px 0 24px;letter-spacing:4px;text-transform:uppercase}
  .cover .row{display:flex;gap:12px;justify-content:center;margin:16px 0}
  .cover .row img{width:54px;height:54px;image-rendering:pixelated}
  .cover p{max-width:470px;margin:8px auto;color:#333;line-height:1.5;font-size:13px}
  .legend{font-size:11px;color:#333;border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;max-width:540px;margin:18px auto;text-align:left;line-height:1.7}
  .legend b{color:var(--red)}
  .cover .meta{margin-top:26px;color:var(--grey);font-size:12px}

  /* section heading block */
  .sec{font-size:15px;font-weight:800;color:var(--red);letter-spacing:1px;text-transform:uppercase;
    border-bottom:2px solid var(--gold);padding-bottom:3px;margin:2px 0 8px}
  /* one family per full-width row — never wraps */
  .fam{break-inside:avoid;border-bottom:1px dotted #e2e2e2;padding:4px 0}
  .path{display:flex;align-items:center;white-space:nowrap;gap:2px;margin:2px 0}
  .u{display:inline-flex;flex-direction:column;align-items:center;text-align:center;min-width:58px}
  .u img{width:40px;height:40px;image-rendering:pixelated}
  .u .no{font-size:8px;color:var(--red);font-weight:700;line-height:1}
  .u .n{font-weight:700;font-size:10px;line-height:1.05}
  .u .alt{font-size:8px;color:var(--grey);line-height:1.1}
  .arr{display:inline-flex;flex-direction:column;align-items:center;min-width:58px;color:#333}
  .arr .mm{font-size:8px;color:#8a6d00;text-align:center;line-height:1.15;white-space:normal;max-width:72px}
  .arr .a{font-size:13px;line-height:1}
  .arr .rg{display:inline-block;background:#eee;border-radius:3px;padding:0 3px;font-weight:700;font-size:7px;margin-bottom:1px}
  /* singles: dense multi-column grid */
  .singles{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 6px}
  .sg{text-align:center}
  .sg img{width:38px;height:38px;image-rendering:pixelated}
  .sg .no{font-size:8px;color:var(--red);font-weight:700;line-height:1}
  .sg .n{font-size:9px;font-weight:600;line-height:1.05}
  .sg .alt{font-size:7px;color:var(--grey);line-height:1}

  @media print{
    body{background:#fff}
    .toolbar{display:none}
    .page{margin:0;box-shadow:none;page-break-after:always}
    .page:last-child{page-break-after:auto}
  }
  @page{size:A4;margin:0}
</style>
</head>
<body>
<div class="toolbar">
  <b>PokéWiki book</b>
  <label>Language&nbsp;
    <select id="lang"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option></select></label>
  <button class="print" onclick="window.print()">🖨 Print / Save PDF</button>
  <span id="status" style="color:#888"></span>
</div>
<div id="out"></div>

<script>
const LANG_LABEL={en:"English",de:"Deutsch",es:"Español"};
let lang="en";
const M={
  en:{lv:n=>"Lv. "+n,up:"Level up",friend:"Friendship",affection:"Affection",beauty:"Beauty",use:x=>x,trade:"Trade",hold:x=>"+ "+x,tradeFor:x=>"↔ "+x,knows:x=>"knows "+x,knowsType:x=>x+" move",at:x=>"@ "+x,with:x=>"+ "+x,withType:x=>"+ "+x,shed:"empty slot",rain:"rain",upside:"upside-down",day:"day",night:"night",crit:"3 crits",dmg:"take damage",recoil:"294 recoil",agile:"agile ×20",strong:"strong ×20",towerDark:"Tower of Darkness",towerWater:"Tower of Waters"},
  de:{lv:n=>"Lv. "+n,up:"Level",friend:"Freundschaft",affection:"Zuneigung",beauty:"Schönheit",use:x=>x,trade:"Tausch",hold:x=>"+ "+x,tradeFor:x=>"↔ "+x,knows:x=>"kann "+x,knowsType:x=>x+"-Att.",at:x=>"@ "+x,with:x=>"+ "+x,withType:x=>"+ "+x,shed:"freier Platz",rain:"Regen",upside:"umgedreht",day:"Tag",night:"Nacht",crit:"3 Treffer",dmg:"Schaden",recoil:"294 Rückstoß",agile:"Flink ×20",strong:"Stark ×20",towerDark:"Turm d. Dunkelheit",towerWater:"Turm d. Wassers"},
  es:{lv:n=>"Nv. "+n,up:"Subir nivel",friend:"Amistad",affection:"Cariño",beauty:"Belleza",use:x=>x,trade:"Intercambio",hold:x=>"+ "+x,tradeFor:x=>"↔ "+x,knows:x=>"sabe "+x,knowsType:x=>"mov. "+x,at:x=>"@ "+x,with:x=>"+ "+x,withType:x=>"+ "+x,shed:"hueco libre",rain:"lluvia",upside:"al revés",day:"día",night:"noche",crit:"3 críticos",dmg:"daño",recoil:"294 retroceso",agile:"ágil ×20",strong:"fuerte ×20",towerDark:"Torre Oscuridad",towerWater:"Torre Aguas"},
};
const REGIONAL_EVO={863:{reg:"GALAR",m:{en:"Lv. 28",de:"Lv. 28",es:"Nv. 28"}},862:{reg:"GALAR",m:{en:"Lv. 35 night",de:"Lv. 35 Nacht",es:"Nv. 35 noche"}},865:{reg:"GALAR",m:{en:"3 crits",de:"3 Treffer",es:"3 críticos"}},866:{reg:"GALAR",m:{en:"Lv. 42",de:"Lv. 42",es:"Nv. 42"}},867:{reg:"GALAR",m:{en:"take dmg + arch",de:"Schaden + Bogen",es:"daño + arco"}},864:{reg:"GALAR",m:{en:"Lv. 38",de:"Lv. 38",es:"Nv. 38"}},900:{reg:"HISUI",m:{en:"Black Augurite",de:"Schwarzaugit",es:"Obsidiana Negra"}},901:{reg:"HISUI",m:{en:"Peat Block",de:"Torfblock",es:"Bloque Turba"}},902:{reg:"HISUI",m:{en:"294 recoil",de:"294 Rückstoß",es:"294 retroceso"}},903:{reg:"HISUI",m:{en:"Razor Claw day",de:"Scharfklaue Tag",es:"Garra Afilada día"}},904:{reg:"HISUI",m:{en:"Barb Barrage ×20",de:"Dornensalve ×20",es:"Púas ×20"}},899:{reg:"HISUI",m:{en:"Psyshield ×20",de:"Psychoschlag ×20",es:"Escudo Psi ×20"}},980:{reg:"PALDEA",m:{en:"Lv. 20",de:"Lv. 20",es:"Nv. 20"}}};
function loc(o){return o?(o[lang]||o.en):"";}
function method(m,targetId){
  const ov=REGIONAL_EVO[targetId];
  if(ov)return `<span class="rg">${ov.reg}</span> ${ov.m[lang]||ov.m.en}`;
  if(!m)return "";
  const t=M[lang]||M.en,p=[],g=m.trigger;
  if(g==="level-up"||g==="other"||!g){
    if(m.level)p.push(t.lv(m.level));else if(m.friendship)p.push(t.friend);else if(m.affection)p.push(t.affection);
    else if(m.beauty)p.push(t.beauty);else if(m.move)p.push(t.knows(loc(m.move)));else if(m.moveType)p.push(t.knowsType(loc(m.moveType)));
    else if(m.upsideDown)p.push(t.upside);else if(m.location)p.push(t.at(loc(m.location)));
    else if(m.partySpecies)p.push(t.with(loc(m.partySpecies)));else if(m.partyType)p.push(t.withType(loc(m.partyType)));else p.push(t.up);
  }else if(g==="trade"){p.push(t.trade);if(m.heldItem)p.push(t.hold(loc(m.heldItem)));if(m.tradeSpecies)p.push(t.tradeFor(loc(m.tradeSpecies)));}
  else if(g==="use-item")p.push(t.use(loc(m.item)));
  else if(g==="shed")p.push(t.shed);else if(g==="three-critical-hits")p.push(t.crit);else if(g==="take-damage")p.push(t.dmg);
  else if(g==="recoil-damage")p.push(t.recoil);else if(g==="agile-style-move")p.push(t.agile);else if(g==="strong-style-move")p.push(t.strong);
  else if(g==="tower-of-darkness")p.push(t.towerDark);else if(g==="tower-of-waters")p.push(t.towerWater);
  else p.push(g.replace(/-/g," "));
  if(m.time)p.push(t[m.time]||m.time);if(m.rain)p.push(t.rain);if(m.heldItem&&g!=="trade")p.push(t.hold(loc(m.heldItem)));
  if(m.gender===1)p.push("♀");if(m.gender===2)p.push("♂");
  return p.join(" ");
}

let DB=null;
const pad=(id)=>"#"+String(id).padStart(4,"0");
const nm=(id)=>{const p=DB.pokemon[id];return p?(p.name[lang]||p.name.en):"#"+id;};
const alt=(id)=>{const p=DB.pokemon[id];if(!p)return "";return ["en","de","es"].filter(l=>l!==lang).map(l=>p.name[l]).filter(Boolean).join(" · ");};
const unit=(id)=>{const p=DB.pokemon[id];const s=p?p.sprite:`sprites/${id}.png`;
  return `<div class="u"><div class="no">${pad(id)}</div><img src="${s}"><div class="n">${nm(id)}</div><div class="alt">${alt(id)}</div></div>`;};
const arrow=(m,targetId)=>`<div class="arr"><div class="mm">${method(m,targetId)}</div><div class="a">→</div></div>`;

// every root→leaf path becomes ONE non-wrapping row (root repeated for branches)
function paths(node,methodIn){
  const head={id:node.id,m:methodIn};
  if(!node.to||!node.to.length)return [[head]];
  const res=[];
  node.to.forEach(c=>paths(c,c.method).forEach(sub=>res.push([head,...sub])));
  return res;
}
function renderFamily(chain){
  const rows=paths(chain,null).map(path=>{
    let h=unit(path[0].id);
    for(let i=1;i<path.length;i++)h+=arrow(path[i].m,path[i].id)+unit(path[i].id);
    return `<div class="path">${h}</div>`;
  }).join("");
  return `<div class="fam">${rows}</div>`;
}

function buildPages(blocks){
  const out=document.getElementById("out");
  let pg,content;
  function newPage(cls){
    pg=document.createElement("div");pg.className="page"+(cls?" "+cls:"");
    pg.innerHTML=`<div class="frame"><div class="phead">◓ Poké<b>Wiki</b> · Evolution Compendium</div><div class="content"></div><div class="pfoot"></div></div>`;
    out.appendChild(pg);content=pg.querySelector(".content");return pg;
  }
  newPage();
  for(const b of blocks){
    if(b.newPage && content.children.length){newPage();}
    content.appendChild(b.el);
    if(content.scrollHeight>content.clientHeight && content.children.length>1){
      content.removeChild(b.el);newPage();content.appendChild(b.el);
    }
  }
  // page numbers
  document.querySelectorAll(".page").forEach((p,i)=>{
    p.querySelector(".pfoot").innerHTML=`<span class="ball"></span>${i+1}`;
  });
}

function render(){
  const out=document.getElementById("out");out.innerHTML="";
  document.getElementById("status").textContent="laying out…";
  const {chains,pokemon}=DB;
  const evoChains=[],multi=new Set();
  for(const cid in chains){
    const c=chains[cid];
    const count=(function cnt(n){return 1+(n.to||[]).reduce((a,b)=>a+cnt(b),0);})(c);
    if(count>1){evoChains.push(c);(function mark(n){multi.add(n.id);(n.to||[]).forEach(mark);})(c);}
  }
  evoChains.sort((a,b)=>a.id-b.id);
  const singleIds=Object.keys(pokemon).map(Number).filter(id=>!multi.has(id)).sort((a,b)=>a-b);

  const blocks=[];
  const el=(html,cls)=>{const d=document.createElement("div");if(cls)d.className=cls;d.innerHTML=html;return d;};

  // page 1: cover
  blocks.push({newPage:false,el:el(`<div class="inner">
    <div></div>
    <h1>Poké<span>Wiki</span></h1>
    <h2>Evolution Compendium</h2>
    <div class="row">${[1,4,7,25,133,149].map(i=>`<img src="${pokemon[i]?pokemon[i].sprite:''}">`).join("")}</div>
    <p>A pocket reference to every Pokémon and how it evolves — names in <b>English</b>, <b>Deutsch</b> and <b>Español</b>, with the exact method and level for each stage. Look any Pokémon up by its number.</p>
    <div class="legend">
      <b>How to read a line:</b> each family reads left → right; the small text on an arrow is the evolution method (level, stone, trade…). Branching families list one path per line.<br>
      <b>Badges</b> like <span style="background:#eee;padding:0 3px;border-radius:3px">GALAR</span> mean only that regional form evolves this way (e.g. <i>Galarian</i> Meowth → Perrserker).<br>
      <b>🔗 Trade</b> evolutions also work with a Linking Cord (Legends: Arceus, BDSP, Scarlet/Violet) — no trading needed.
    </div>
    <div class="meta">${DB.count} Pokémon · ${evoChains.length} evolution families · Gen I–IX<br>Data © PokéAPI / Pokémon · language: ${LANG_LABEL[lang]}</div>
    <div></div>
  </div>`)});

  // families
  blocks.push({newPage:true,el:el(`Evolution Families`,"sec")});
  evoChains.forEach(c=>blocks.push({newPage:false,el:el(renderFamily(c))}));
  // singles — chunk into rows so they paginate cleanly and keep column alignment
  blocks.push({newPage:true,el:el(`Single-stage Pokémon`,"sec")});
  const COLS=6;
  for(let i=0;i<singleIds.length;i+=COLS){
    const row=el("","singles");
    singleIds.slice(i,i+COLS).forEach(id=>{const d=document.createElement("div");d.className="sg";
      d.innerHTML=`<div class="no">${pad(id)}</div><img src="${pokemon[id].sprite}"><div class="n">${nm(id)}</div><div class="alt">${alt(id)}</div>`;row.appendChild(d);});
    blocks.push({newPage:false,el:row});
  }

  buildPages(blocks);
  // apply cover class to first page
  const first=document.querySelector(".page");if(first)first.classList.add("cover");
  document.getElementById("status").textContent="";
}

document.getElementById("lang").addEventListener("change",e=>{lang=e.target.value;render();});
(async()=>{try{DB=await (await fetch("data/pokedex.json")).json();render();}
catch(e){document.getElementById("out").innerHTML="<div class='page'><div class='frame'>Failed to load data: "+e+"</div></div>";}})();
</script>
</body>
</html>
